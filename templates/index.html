<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>FUTEBOL PARANAENSE</title>
</head>
<body>
    <h2>Qual é o seu time do coração?</h2>
    <form action="/escolher" method="POST">
        <select name="time" required>
            <option value="coritiba">Coritiba</option>
            <option value="athletico">Athletico</option>
            <option value="parana">Parana</option>
        </select>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
